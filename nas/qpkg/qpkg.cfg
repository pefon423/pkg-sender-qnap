# QNAP QDK package manifest for the PS5 PKG Sender native package.
#
# Field names verified against QNAP's official QDK-Guide example
# (github.com/qnap-dev/QDK-Guide, example/QPKG/helloWorld/qpkg.cfg).
#
# Per-arch payload directories (x86, arm-x19, arm-x31, arm-x41, arm_64,
# shared, config, icons) intentionally use qbuild's default directory names
# rather than QDK_DATA_DIR_* overrides, since the official template we could
# verify did not confirm an override variable name for the 64-bit arm_64
# directory. build.sh populates exactly one arch directory per invocation.
#
# Confirmed target: TS-459 Pro (Intel Atom D510) running QTS 4.2.6 as a
# 32-bit userspace -> ARCH=x86. The arm-* directories are kept in case this
# package is later built for a different NAS.

QPKG_NAME="PKGSenderNAS"
QPKG_DISPLAY_NAME="PS5 PKG Sender"
QPKG_VER="@VERSION@"
QPKG_AUTHOR="mrggbond"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Install PS5 PKG files directly from a QNAP NAS over the local network."

# Preferred number in start/stop sequence (rc.d ordering). Adjust if it
# collides with another installed QPKG on the target NAS.
QPKG_RC_NUM="150"
# Init-script used to control start/stop of the installed application.
QPKG_SERVICE_PROGRAM="PKGSenderNAS.sh"

# Web UI is the daemon's existing embedded UI (see nas/internal/httpserver/ui.go).
QPKG_WEBUI="/ui/"
QPKG_WEB_PORT="9898"

QTS_MINI_VERSION="4.2.0"

# Show under Utilities for administrators only (default visibility level).
#QPKG_VISIBLE="1"
